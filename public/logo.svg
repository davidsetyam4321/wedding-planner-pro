<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SatuJanji">
  <defs>
    <linearGradient id="sj" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#09426c" />
      <stop offset="100%" stopColor="#117bc8" />
    </linearGradient>
    <linearGradient id="sjcore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#60a8dd" />
      <stop offset="100%" stopColor="#0d5c96" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sj)" />
