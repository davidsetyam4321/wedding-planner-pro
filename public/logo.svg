    <ellipse cx="256" cy="160" rx="44" ry="62" transform="rotate(144 256 256)" />
    <ellipse cx="256" cy="160" rx="44" ry="62" transform="rotate(216 256 256)" />
    <ellipse cx="256" cy="160" rx="44" ry="62" transform="rotate(288 256 256)" />
    <ellipse cx="256" cy="160" rx="44" ry="62" transform="rotate(0 256 256)" />
  </g>
  <circle cx="256" cy="256" r="34" fill="url(#sjcore)" />
  <circle cx="256" cy="256" r="9" fill="#ffffff" fillOpacity="0.9" />
